<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate seed rate and crop spacing with AgriEstimate.">
  <title>Seed Rate & Spacing | AgriEstimate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <nav class="container">
      <a class="brand" href="index.html">🌱 AgriEstimate</a>
      <a class="nav-link" href="index.html">Back</a>
    </nav>
  </header>

  <main class="container calculator-page">
    <div class="card">
      <div class="section-heading">
        <span class="icon">🌾</span>
        <div><h1>Seed rate & spacing</h1><p>Find the seed quantity and recommended planting distance.</p></div>
      </div>
      <form id="seed-form" class="form-grid">
        <label>Crop
          <select id="seed-crop" required></select>
        </label>
        <label>Area
          <input id="seed-area" type="number" min="0.01" step="0.01" value="1" required>
        </label>
        <label>Area unit
          <select id="seed-unit"><option value="hectare">Hectare</option><option value="acre">Acre</option></select>
        </label>
        <button class="primary-button form-button" type="submit">Calculate seed</button>
      </form>
      <div id="seed-result" class="result hidden" aria-live="polite"></div>
    </div>
    <p class="disclaimer">Seed requirements can vary by variety, germination percentage and sowing method.</p>
  </main>

  <footer><p>AgriEstimate · Smart calculations for better farming</p></footer>
  <script src="script.js"></script>
</body>
</html>
