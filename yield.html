<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estimate maize grain yield with AgriEstimate.">
  <title>Yield Estimation | AgriEstimate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <nav class="container">
      <a class="brand" href="index.html">🌱 AgriEstimate</a>
      <a class="nav-link" href="index.html">Back</a>
    </nav>
  </header>

  <main class="container calculator-page">
    <div class="card">
      <div class="section-heading">
        <span class="icon">📈</span>
        <div><h1>Maize yield estimation</h1><p>Estimate grain yield using a representative plant sample.</p></div>
      </div>
      <form id="yield-form" class="form-grid">
        <label>Area
          <input id="yield-area" type="number" min="0.01" step="0.01" value="1" required>
        </label>
        <label>Area unit
          <select id="yield-unit"><option value="hectare">Hectare</option><option value="acre">Acre</option></select>
        </label>
        <label>Row spacing (cm)
          <input id="row-spacing" type="number" min="1" value="60" required>
        </label>
        <label>Plant spacing (cm)
          <input id="plant-spacing" type="number" min="1" value="20" required>
        </label>
        <label>Final plant population (%)
          <input id="population-percent" type="number" min="1" max="100" value="90" required>
        </label>
        <label>Average cobs per plant
          <input id="cobs-per-plant" type="number" min="0.1" step="0.1" value="1" required>
        </label>
        <label>Average rows per cob
          <input id="rows-per-cob" type="number" min="1" value="14" required>
        </label>
        <label>Average seeds per row
          <input id="seeds-per-row" type="number" min="1" value="30" required>
        </label>
        <label>100-grain test weight (g)
          <input id="test-weight" type="number" min="1" step="0.1" value="28" required>
        </label>
        <button class="primary-button form-button" type="submit">Estimate yield</button>
      </form>
      <div id="yield-result" class="result hidden" aria-live="polite"></div>
    </div>
    <p class="disclaimer">This is a theoretical estimate. Moisture, pests, weather and field losses affect actual yield.</p>
  </main>

  <footer><p>AgriEstimate · Smart calculations for better farming</p></footer>
  <script src="script.js"></script>
</body>
</html>
