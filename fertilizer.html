<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estimate fertilizer quantities with AgriEstimate.">
  <title>Fertilizer Calculator | AgriEstimate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <nav class="container">
      <a class="brand" href="index.html">🌱 AgriEstimate</a>
      <a class="nav-link" href="index.html">Back</a>
    </nav>
  </header>

  <main class="container calculator-page">
    <div class="card">
      <div class="section-heading">
        <span class="icon">🧪</span>
        <div><h1>Fertilizer calculator</h1><p>Estimate common fertilizer quantities from the recommended NPK dose.</p></div>
      </div>
      <form id="fertilizer-form" class="form-grid">
        <label>Crop
          <select id="fertilizer-crop" required></select>
        </label>
        <label>Area
          <input id="fertilizer-area" type="number" min="0.01" step="0.01" value="1" required>
        </label>
        <label>Area unit
          <select id="fertilizer-unit"><option value="hectare">Hectare</option><option value="acre">Acre</option></select>
        </label>
        <label>Season
          <select id="season"><option>Irrigated</option><option>Rainfed</option></select>
        </label>
        <button class="primary-button form-button" type="submit">Calculate fertilizer</button>
      </form>
      <div id="fertilizer-result" class="result hidden" aria-live="polite"></div>
    </div>
    <p class="disclaimer">Use locally approved fertilizer recommendations before applying these results in the field.</p>
  </main>

  <footer><p>AgriEstimate · Smart calculations for better farming</p></footer>
  <script src="script.js"></script>
</body>
</html>
